<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#060709" />
        <title>Hors ligne</title>
        <style>
            html {
                background: #060709;
                color: #f4f5f7;
                font-family: ui-sans-serif, system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            body {
                max-width: 390px;
                margin: 0 auto;
                padding: max(54px, env(safe-area-inset-top)) 16px 32px;
            }

            .label {
                margin: 0;
                color: oklch(0.68 0.01 260);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            h1 {
                margin: 22px 0 0;
                font-size: 28px;
                font-weight: 500;
                line-height: 1.1;
                letter-spacing: -0.02em;
            }

            p {
                margin: 12px 0 0;
                color: oklch(0.68 0.01 260);
                font-size: 15px;
                line-height: 1.4;
            }

            a {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 48px;
                margin-top: 24px;
                border-radius: 12px;
                background: oklch(0.78 0.16 60);
                color: #060709;
                font-size: 15px;
                font-weight: 600;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <p class="label">Golf</p>
        <h1>Hors ligne</h1>
        <p>Cette page n'a pas encore été ouverte sur ce téléphone.</p>
        <a href="/import">Importer une carte</a>
    </body>
</html>
