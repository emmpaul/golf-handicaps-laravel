name: Setup
description: Installe PHP, PNPM, Node, les dépendances Composer et PNPM, puis prépare .env.

runs:
  using: composite
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        extensions: pdo_pgsql
        tools: composer:v2
        coverage: none

    - name: Set up PNPM
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: pnpm

    - name: Locate the Composer archive cache
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer archives
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Install PNPM dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Prepare .env
      shell: bash
      run: cp .env.example .env && php artisan key:generate --ansi
